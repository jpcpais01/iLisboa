name: ai-video-test
on:
  push:
    branches: ['claude/**']
    paths: ['vtest/go']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: vtest, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: run
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          set -a; . vtest/go; set +a
          node vtest/run.mjs
      - name: commit results
        if: always()
        run: |
          git config user.name "ai-video-test"; git config user.email "actions@users.noreply.github.com"
          git add vtest/out
          git commit -m "vtest: results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
