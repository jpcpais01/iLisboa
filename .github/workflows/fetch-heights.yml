name: fetch-heights
# Overture Maps building heights (non-OSM sources) for the city bbox → data/raw/heights.csv.gz, committed.
on:
  workflow_dispatch:
  push:
    paths: [pipeline/overture_heights.py, .github/workflows/fetch-heights.yml]
concurrency: fetch-heights
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Overture buildings (S3, bbox-filtered)
        run: |
          set -e
          mkdir -p data/raw
          pip install -q duckdb
          python pipeline/overture_heights.py
      - name: Commit
        run: |
          git config user.name "ilisboa-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/heights.csv.gz
          git diff --cached --quiet || (git commit -m "data: Overture building heights [skip ci]" && git pull --rebase -q && git push)
