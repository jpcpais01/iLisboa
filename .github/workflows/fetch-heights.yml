name: fetch-heights
# GHSL average building height grid for the city bbox → data/raw/ghsl_h.json, committed.
on:
  workflow_dispatch:
  push:
    paths: [pipeline/ghsl_heights.py, .github/workflows/fetch-heights.yml]
concurrency: fetch-heights
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read GHS-BUILT-H window
        run: |
          set -e
          mkdir -p data/raw
          pip install -q rasterio
          python pipeline/ghsl_heights.py
      - name: Commit
        run: |
          git config user.name "ilisboa-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/ghsl_h.json
          git diff --cached --quiet || (git commit -m "data: GHSL building heights [skip ci]" && git pull --rebase -q && git push)
