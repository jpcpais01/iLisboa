name: fetch-detail
# Per-building detail sources for the realism pilot: DGT orthophotos (WMS) and any finer DGT LiDAR surface model.
# Runs when pipeline/fetch_detail.py or this file changes on main. Uses the DGT_USER / DGT_PASSWORD secrets.
on:
  workflow_dispatch:
  push:
    paths: [pipeline/fetch_detail.py, .github/workflows/fetch-detail.yml]
concurrency: fetch-detail
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy python3-requests > /dev/null
      - name: Fetch
        env:
          DGT_USER: ${{ secrets.DGT_USER }}
          DGT_PASSWORD: ${{ secrets.DGT_PASSWORD }}
        run: /usr/bin/python3 pipeline/fetch_detail.py
      - name: Commit
        if: always()
        run: |
          [ -d data/detail ] || exit 0
          git config user.name "ilisboa-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/detail
          git diff --cached --quiet || (git commit -m "data: detail sources for the realism pilot [skip ci]" && git pull --rebase -q && git push)
