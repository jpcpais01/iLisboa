name: fetch-layers
# Static data for the map layers (freguesia borders, census population, weather station list) → public/layers.
# Runs on demand, or when the layer fetch scripts change. The sandbox that builds the city can't reach these hosts.
on:
  workflow_dispatch:
  push:
    paths: [pipeline/layers/**, .github/workflows/fetch-layers.yml]
concurrency: fetch-layers
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "pipeline\napi\npublic/layers\n.github", sparse-checkout-cone-mode: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: OSM administrative boundaries (Geofabrik → osmium)
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          curl -sfL -o /tmp/pt.osm.pbf https://download.geofabrik.de/europe/portugal-latest.osm.pbf
          osmium tags-filter /tmp/pt.osm.pbf r/boundary=administrative -O -o /tmp/adm.pbf
          osmium extract -b -9.45,38.55,-8.90,38.92 --strategy smart -O -o /tmp/adm-lx.pbf /tmp/adm.pbf
          osmium export /tmp/adm-lx.pbf --geometry-types=polygon -O -o /tmp/adm.geojson
          ls -la /tmp/adm.geojson
      - name: Probe sources + build layers
        run: node pipeline/layers/fetch.mjs /tmp/adm.geojson
      - name: Commit
        run: |
          git config user.name "ilisboa-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/layers pipeline/layers/probe
          git diff --cached --quiet || (git commit -m "data: refresh map layers [skip ci]" && git pull --rebase -q && git push)
