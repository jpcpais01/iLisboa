name: fetch-lidar
# Pulls the DGT 2024 LiDAR terrain and surface models (2 m) into data/lidar, one pair of rasters per area.
# Needs the DGT_USER / DGT_PASSWORD repository secrets (a free account at cdd.dgterritorio.gov.pt);
# without them it only probes the catalogue.
on:
  workflow_dispatch:
  push:
    paths: [pipeline/fetch_lidar.py, .github/workflows/fetch-lidar.yml]
concurrency: fetch-lidar
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy python3-requests > /dev/null
      - name: Fetch LiDAR
        env:
          DGT_USER: ${{ secrets.DGT_USER }}
          DGT_PASSWORD: ${{ secrets.DGT_PASSWORD }}
        run: /usr/bin/python3 pipeline/fetch_lidar.py
      - name: Commit
        run: |
          [ -d data/lidar ] || exit 0
          git config user.name "ilisboa-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lidar
          git diff --cached --quiet || (git commit -m "data: DGT LiDAR heights and terrain [skip ci]" && git pull --rebase -q && git push)
