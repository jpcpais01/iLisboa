<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e2d6" />
    <title>iLisboa</title>
    <meta name="description" content="Lisbon as a real-scale low-poly diorama, built from open data." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='14' width='8' height='14' fill='%23e9c77c'/><rect x='13' y='8' width='8' height='20' fill='%23f2eee6' stroke='%23b45a3a'/><rect x='22' y='16' width='7' height='12' fill='%23e8b7a0'/><path d='M3 14l5-4 5 4M12 8l5-4 5 4M21 16l4-3 4 3' fill='%23b45a3a'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <header class="brand">
      <h1>iLisboa</h1>
      <p id="subtitle">Baixa · Alfama</p>
    </header>
    <div class="sun">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" /></svg>
      <input id="time" type="range" min="7" max="20.5" step="0.05" value="16.5" aria-label="Hora do dia" />
      <span id="clock">16:30</span>
    </div>
    <div id="loading"><div class="bar"><i id="progress"></i></div><span>a construir Lisboa…</span></div>
    <footer id="attrib"></footer>
    <div id="stats" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
